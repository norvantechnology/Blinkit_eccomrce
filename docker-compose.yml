services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: blinkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blinkit
    ports:
      - "5433:5432"
    volumes:
      - blinkit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blinkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blinkit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - blinkit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: blinkit-backend:latest
    container_name: blinkit-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # No .env — config from Secrets Manager at boot.
      # Live: EC2 instance role. Local: export AWS_* before compose, or mount ~/.aws.
      AWS_REGION: ap-south-1
      NODE_ENV: production
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  blinkit_pgdata:
  blinkit_redis:
