services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: blinkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blinkit
    ports:
      - "5433:5432"
    volumes:
      - blinkit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blinkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blinkit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - blinkit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: blinkit-backend:latest
    container_name: blinkit-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blinkit?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@gmail.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin@123}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      PORT: 4000
      NODE_ENV: production
      RUN_DB_SETUP: ${RUN_DB_SETUP:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  blinkit_pgdata:
  blinkit_redis:
