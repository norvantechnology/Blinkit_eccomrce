name: Deploy All

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-all
  cancel-in-progress: false

env:
  EC2_USER: ubuntu
  EC2_NAME_TAG: tapi-grocery-api
  AMPLIFY_BRANCH: main
  REPO_URL: https://github.com/norvantechnology/Blinkit_eccomrce

jobs:
  deploy-backend:
    name: '1 · Backend → EC2'
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.resolve.outputs.api_url }}
    steps:
      - name: Require secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "Missing: AWS_ACCESS_KEY_ID"; missing=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "Missing: AWS_SECRET_ACCESS_KEY"; missing=1; }
          [ -n "$AWS_REGION" ] || { echo "Missing: AWS_REGION"; missing=1; }
          [ -n "$EC2_SSH_KEY" ] || { echo "Missing: EC2_SSH_KEY"; missing=1; }
          exit $missing

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve EC2 public IP
        id: resolve
        run: |
          set -euo pipefail
          HOST=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${EC2_NAME_TAG}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ -z "$HOST" ] || [ "$HOST" = "None" ]; then
            echo "ERROR: no running EC2 tagged Name=${EC2_NAME_TAG}"
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "api_url=http://${HOST}:4000" >> "$GITHUB_OUTPUT"
          echo "EC2 → $HOST"

      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.resolve.outputs.host }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/opt/blinkit"
            REPO_URL="https://github.com/norvantechnology/Blinkit_eccomrce.git"
            command -v docker >/dev/null || { echo "docker missing"; exit 1; }
            mkdir -p "$APP_DIR" && cd "$APP_DIR"
            if [ ! -d .git ]; then git clone "$REPO_URL" .
            else
              git remote set-url origin "$REPO_URL" || true
              git fetch origin main && git checkout -B main origin/main
            fi
            [ -f backend/.env ] || { echo "missing backend/.env"; exit 1; }
            docker compose --env-file backend/.env pull || true
            docker compose --env-file backend/.env up -d --build backend postgres redis
            docker compose ps

  deploy-user-web:
    name: '2 · User web → Amplify'
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Amplify user-web
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID_USER_WEB }}
          APP_NAME: tapi-grocery-user-web
          APP_ROOT: user-web
          AMPLIFY_BRANCH: main
          GH_PAT: ${{ secrets.GH_PAT }}
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
          API_FALLBACK: ${{ needs.deploy-backend.outputs.api_url }}
        run: bash .github/scripts/amplify-deploy.sh

  deploy-admin-panel:
    name: '3 · Admin panel → Amplify'
    needs: [deploy-backend, deploy-user-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Amplify admin
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID_ADMIN }}
          APP_NAME: tapi-grocery-admin
          APP_ROOT: admin-panel
          AMPLIFY_BRANCH: main
          GH_PAT: ${{ secrets.GH_PAT }}
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
          API_FALLBACK: ${{ needs.deploy-backend.outputs.api_url }}
        run: bash .github/scripts/amplify-deploy.sh
