name: Deploy User Web → Amplify

# Blinkit.md §13.1 — user-web via Amplify/ECS. This workflow triggers an Amplify release job.

on:
  push:
    branches: [main]
    paths:
      - 'user-web/**'
      - '.github/workflows/deploy-user-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-user-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Amplify release (user-web)
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start Amplify job
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID_USER_WEB }}
          BRANCH: ${{ secrets.AMPLIFY_BRANCH }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID}" ]; then
            echo "Missing secret AMPLIFY_APP_ID_USER_WEB"
            exit 1
          fi
          BRANCH_NAME="${BRANCH:-main}"
          aws amplify start-job \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH_NAME" \
            --job-type RELEASE
          echo "Triggered Amplify RELEASE for user-web ($APP_ID / $BRANCH_NAME)"
